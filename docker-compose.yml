name: sales-trainer

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_trainer_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sales_trainer
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_trainer_backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sales_trainer
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  snapshot-token-usage:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_trainer_snapshot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sales_trainer
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "app.admin.cli", "snapshot-token-usage"]
    profiles:
      - "snapshot"

  snapshot-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_trainer_scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sales_trainer
      TZ: Europe/Moscow
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "/app/deploy/snapshot_scheduler.py"]
    restart: unless-stopped

  persona-pool-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_trainer_persona_pool
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sales_trainer
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "/app/deploy/persona_pool_worker.py"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sales_trainer_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  redis:
    image: redis:7-alpine
    container_name: sales_trainer_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: sales_trainer_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_trainer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sales_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
