server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # The host nginx terminates TLS and proxies from the compose subnet. Trusting
    # that range lets $remote_addr (and therefore X-Forwarded-For to the backend)
    # carry the real client IP instead of the proxy address.
    # Keep the range in sync with the compose subnet and TRUSTED_PROXY_IPS.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
