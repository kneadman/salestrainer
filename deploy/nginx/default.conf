server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # The host nginx terminates TLS and proxies from the compose subnet. Trusting
    # that range lets $remote_addr (and therefore X-Forwarded-For to the backend)
    # carry the real client IP instead of the proxy address.
    # Keep the range in sync with the compose subnet and TRUSTED_PROXY_IPS.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Persona generation is an LLM call that may retry once on schema validation
    # failure, so a single POST /api/sessions can take over a minute. The nginx
    # default of 60s turns that into a 504 while the backend keeps working and
    # silently creates the session. Keep this above the worst-case LLM budget.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # nginx resolves a proxy_pass hostname once at startup and caches the IP. When
    # the backend container is recreated it gets a new address, and a running
    # frontend keeps proxying to the dead one: every request returns 502 until the
    # frontend itself is restarted. Routing through a variable forces nginx to
    # re-resolve per request, so a backend redeploy needs no frontend restart.
    # "valid=10s" caches the answer briefly to avoid a DNS lookup per request;
    # resolver 127.0.0.11 is Docker's embedded DNS server.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
