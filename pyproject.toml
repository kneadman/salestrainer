[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-trainer-mvp"
version = "0.1.0"
description = "Interactive web sales trainer with stateless LLM simulation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "email-validator>=2.0,<3.0",
    "pytest>=8.0,<9.0",
    "argon2-cffi>=23.1,<24.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "openai>=1.75,<2.0",
    "jinja2>=3.1,<4.0",
    "cryptography>=42.0,<46.0",
    "tiktoken>=0.9,<1.0",
]

[tool.setuptools.packages.find]
# Auto-discovery instead of a hand-maintained list. A forgotten entry used to
# ship a half-installed wheel: ``app.blog`` and the prompt ``*.md`` files were
# missing, which only surfaced in containers running from site-packages.
include = ["app*"]
exclude = ["tests*"]

# Master prompts and the seed template are read from disk at runtime.
[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
