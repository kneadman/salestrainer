[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-trainer-mvp"
version = "0.1.0"
description = "Interactive CLI sales trainer MVP with stateless LLM simulation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pytest>=8.0,<9.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "openai>=1.75,<2.0",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.application",
    "app.cli",
    "app.domain",
    "app.infrastructure",
    "app.prompts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
